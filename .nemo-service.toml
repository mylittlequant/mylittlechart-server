[service]
name = "mylittlechart-server"
kind = "http_api"
display_name = "mylittlechart Server"
description = "Backend для mylittlechart.org — auth, sync, OTA, telegram bot, agent keys"

[links]
public_url = "https://mylittlechart.org"
local_url = "http://127.0.0.1:19200"
admin_url = "http://127.0.0.1:19237"
docs = "mylittlechart-server/docs/"

[[endpoints]]
method = "GET"
path = "/health"
description = "Health check"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/api/proxy/entitlement"
description = "Public archive-proxy policy (gate=open|entitled, entitled bool, relay=planned|paid)"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/api/entitlements"
description = "Feature entitlements for the caller (session cookie, bearer token, or anonymous). Returns {features:[...], expires_at:ms}. Free set comes from MLC_FREE_FEATURES; unset means every feature, which is the default and changes nothing."
auth = "optional"
public = true

[[endpoints]]
method = "POST"
path = "/api/heartbeat"
description = "Client heartbeat — reports client alive, version, telemetry"
auth = "none"
public = true

[[endpoints]]
method = "POST"
path = "/api/telemetry"
description = "Submit anonymous telemetry data"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/api/updates/latest"
description = "Get latest release metadata for OTA updates"
auth = "none"
public = true

[[endpoints]]
method = "POST"
path = "/api/admin/restart"
description = "Gracefully restart the server process"
auth = "bearer"
auth_env = "ADMIN_SECRET"
public = false

[[endpoints]]
method = "POST"
path = "/api/admin/register-release"
description = "Register a release manifest row (metadata only — filename, sha256, size, notes). The artifact itself is never uploaded here: mlc-opsd (see mylittlechart-server/crates/opsd) uploads and sha256-verifies it on both public edges first, then calls this endpoint. Replaces the old body-accepting /api/admin/upload."
auth = "bearer"
auth_env = "ADMIN_SECRET"
public = false

[[endpoints]]
method = "POST"
path = "/api/admin/promote"
description = "Promote an uploaded binary to latest"
auth = "bearer"
auth_env = "ADMIN_SECRET"
public = false

[[endpoints]]
method = "POST"
path = "/api/auth/device-code"
description = "Start device authorization flow — returns device code"
auth = "none"
public = true

[[endpoints]]
method = "GET"
path = "/api/auth/poll"
description = "Poll device authorization flow for completion"
auth = "none"
public = true

[[endpoints]]
method = "POST"
path = "/api/sync/push"
description = "Push cloud sync changes from client"
auth = "bearer"
public = false

[[endpoints]]
method = "POST"
path = "/api/share/{token}/clone"
description = "Clone a live chart share into the caller's own preset (rights v1). Requires the `clone` right on the token (owner, or the share was created with clone_allowed=true); indicators the caller has no vendor grant for are stripped and listed in the response. 403 without the right, 400 for a screenshot token, 404 for unknown/revoked/expired."
auth = "bearer"
public = false

[[manage_actions]]
id = "graceful_restart"
label = "Graceful Restart"
description = "Trigger a graceful server restart via admin API"
method = "POST"
path = "/api/admin/restart"
auth = "bearer"
auth_env = "ADMIN_SECRET"
confirm = true

[health]
endpoint = "/health"

[dependencies]
# Serves mylittlechart-landing (static web + WASM) via tower_http ServeDir
upstream = ["mylittlechart-landing"]
# cloudflared tunnel exposes this server publicly as mylittlechart.org
downstream = ["cloudflared-mylittlechart"]
