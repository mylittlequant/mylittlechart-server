# mylittlechart onion mirror — the vhost Tor's `HiddenServicePort 80
# 127.0.0.1:8081` lands on. One server block, listening on loopback only.
#
# Installed by CICD/mlc/scripts/deploy-tor-mirror.sh as
# /etc/nginx/conf.d/mlc-onion.conf on both edges (each edge has its own onion
# address; this file carries none — the request `Host` is the address).
#
# Plain HTTP is correct here: the onion transport already authenticates the
# service and encrypts end to end, so there is no certificate, no port 443 and
# no Strict-Transport-Security. No header below names a clearnet or third-party
# URL (the CSP lists URL schemes only, exactly like the clearnet site).
#
# Names this file shares with the clearnet site (nginx-mlc-site.conf, same
# nginx, http level): `upstream mlc_backend`, `map $app_cache`, and the
# `$connection_upgrade` map the clearnet site already uses for WebSockets.
#
# Differences from the clearnet server block, on purpose:
#   * X-Forwarded-For is OVERWRITTEN with the socket peer instead of appended
#     to. The backend trusts the leftmost X-Forwarded-For value from a
#     WireGuard peer, so appending would let any onion visitor pick its own
#     rate-limit bucket. Every onion visitor reaches nginx from Tor on
#     127.0.0.1, so the whole onion mirror shares one per-IP bucket in the app.
#   * X-Forwarded-Proto is `http` (it is).
#   * Referrer-Policy is `same-origin` (no origin leaks to exchange hosts).
#   * absolute_redirect off: a redirect nginx builds itself (directory slash,
#     /blog) stays relative, so the local port 8081 never shows in Location.
#   * Not mirrored: /archive-proxy/ (its Access-Control-Allow-Origin names the
#     clearnet site), /dl/, the `/?share=` og:image detour (crawlers do not
#     use onion services), and the nginx limit_req zones (keyed on the client
#     address, which is always loopback here; the app's own limiter is the
#     layer that applies).
server {
    listen 127.0.0.1:8081 default_server;
    server_name *.onion;

    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 10m;

    # ── wasm chart app (legacy /app/ entry) ────────────────────────────────
    location /app/ {
        alias /opt/mlc/static/app/;
        try_files $uri $uri/ /app/index.html;

        brotli_static on;

        add_header Cache-Control $app_cache;
        add_header Vary Accept-Encoding;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # Live pointer stream (WebSocket) — one hub on the control box holds every
    # room; the ticket in the query string is minted by
    # /api/share/{token}/stream-open.
    location /api/share-live/ {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Matrix Client-Server API subset. GET /_matrix/client/v3/sync is a long
    # poll (up to 30 s): the read timeout has to outlast it and buffering stays
    # off so a wake reaches the client the moment the backend writes it.
    location /_matrix/ {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── wasm chart app at / (canonical entry) ──────────────────────────────
    # Paths that do not exist in the app dir (marketing pages, landing
    # assets) fall through to the backend via the named location.
    location / {
        root /opt/mlc/static/app;
        index index.html;
        try_files $uri $uri/ @mlc_backend;

        brotli_static on;

        add_header Cache-Control $app_cache;
        add_header Vary Accept-Encoding;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # Marketing landing: /home is the backend's `/`.
    location = /home {
        proxy_pass http://mlc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location = /home/ {
        proxy_pass http://mlc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /blog {
        return 301 /blog/;
    }

    location @mlc_backend {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
