# Rate limit for the public, unauthenticated write endpoints.
#
# /api/telemetry and /api/heartbeat take no credential — a bearer token is
# optional and only links the row to a user — and every accepted call appends a
# row to the database that also holds every account. Application-level limiting
# is deliberately deferred in the code (routes/mod.rs: tower_governor 0.4 is
# incompatible with axum 0.8), and the compensating control that comment names
# is "the Cloudflare level".
#
# Measured 2026-08-30: forty rapid requests to /api/telemetry from one address
# drew no 429 and no challenge. That rule does not exist. Limiting here instead
# — it is ours, it is in git, and it does not depend on a dashboard setting
# nobody can see from the repository.
#
# $binary_remote_addr is the real client address: cf-realip.conf restores it
# from CF-Connecting-IP before this is evaluated.
#
# Sizing: a device posts on its OTA tick — six times a day on the stable
# channel. Ten a minute is three orders of magnitude of headroom for anything
# legitimate, including a NAT'd office, and still caps a single abusive address
# hard.
limit_req_zone $binary_remote_addr zone=mlc_public_write:10m rate=10r/m;
limit_req_status 429;

# Device-code/agent-key/link/tg-login polling loops (2026-09-10). Same
# reasoning as `mlc_public_write` above — these four paths take no
# credential at all (a device-code/agent-key/link token IS the capability),
# so an unbounded-rate guesser is limited only by code entropy + a short TTL
# today. This zone is a second, independent layer in front of the app's own
# in-process per-IP `auth_poll` bucket (60/min, burst 30 — see
# mylittlechart-server's `ratelimit.rs`), not a replacement for it.
limit_req_zone $binary_remote_addr zone=mlc_auth_poll:10m rate=60r/m;
