# mylittlechart.org origin — behind Cloudflare proxy (SSL mode: Full)
upstream mlc_backend { server 10.77.0.1:19200; }  # control box over WireGuard (2026-08-30)

# Any `/?share=<token>` is detoured to the control box, which rewrites
# og:image on a copy of this edge's index.html (deploy-app.sh copies it
# to STATIC_DIR/index.html). One response for browsers and crawlers, so a
# cache in front of the edge cannot pin the generic card. The document is
# still the app: the wasm URLs inside it are unchanged.
map $arg_share $mlc_share_preview {
    default 0;
    "~.+" 1;
}
map $hostname $mlc_edge_name {
    default "";
    mlc-utah-1 utah;
    ubuntu-Amsterdam-2gb ams;
}
# The backend no longer runs beside nginx. Identity moved to a control box
# with no public listener; the edges reach it across the tunnel, and that
# box accepts :19200 only with `iifname wg0`.
#
# 2026-09-10 hardening: the app (mylittlechart-server) now ALSO rate-limits
# every `/api/*` path per client IP in-process (see its `ratelimit.rs`) —
# the `limit_req` zones below are a second, independent layer in front of
# that, not a replacement for it.

# The app boot document must never be cached (it points at versioned assets);
# the versioned assets themselves are immutable. The app is served both at /
# (canonical) and /app/ (legacy); / hits the index directive, which internally
# rewrites to /index.html — both forms are no-cache.
map $uri $app_cache {
    default                     "public, max-age=31536000, immutable";
    ~*^/$                       "no-cache";
    ~*^/index\.html$            "no-cache";
    ~*^/app/index\.html$        "no-cache";
    ~*^/app/$                   "no-cache";
}

# Archive CDN day-files are immutable for a day once published; live
# exchange REST proxied through the same prefix must never be cached.
map $uri $archproxy_cache {
    ~*^/archive-proxy/(data\.binance\.vision|public\.bybit\.com|static\.okx\.com)/ "public, max-age=86400";
    default                     "no-store";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate     /etc/nginx/mlc-origin.crt;
    ssl_certificate_key /etc/nginx/mlc-origin.key;
    server_name mylittlechart.org www.mylittlechart.org utah.mylittlechart.org ams.mylittlechart.org;

    # 2026-09-10: lowered from 220m. That ceiling was a leftover from the
    # deleted body-accepting admin-upload route (replaced by the
    # metadata-only `POST /api/admin/register-release` — see admin.rs's own
    # doc comment); nothing this backend accepts today needs more than the
    # 8 MiB `/api/share/screenshot` override (`routes/mod.rs`). 10m keeps
    # comfortable headroom above that without leaving a 200+ MB gap for an
    # unauthenticated POST to push at any other route before axum's own
    # (2 MiB default / 8 MiB override) body limit would have cut it anyway.
    client_max_body_size 10m;

    # ── wasm chart app ─────────────────────────────────────────────────────
    # Static, precompressed (.br sidecars from the build pipeline),
    # bypasses the axum backend entirely.
    location /app/ {
        alias /opt/mlc/static/app/;
        try_files $uri $uri/ /app/index.html;

        brotli_static on;

        add_header Cache-Control $app_cache;
        add_header Vary Accept-Encoding;
        # CSP: wasm-unsafe-eval is required to instantiate the module.
        # connect-src: live exchange websockets + REST backfill go DIRECT
        # from the browser; /archive-proxy/ on self covers deep history.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── exchange data proxy (archive CDNs + CORS-blocked live REST) ───────
    # The wasm shell fetches deep-history archive zips AND the live REST of
    # venues whose REST has no ACAO (mlc `CORS_BLOCKED_REST`, remeasured
    # 2026-08-28: BingX/Bitfinex/Coinbase/CryptoCom/Kraken/KuCoin/MEXC/
    # Upbit — NOT OKX/Gate/HTX, those go direct). Host allowlist mirrors dig3's
    # `core::proxy_allowlist::REST_HOST_ALLOWLIST` (all 20 venues, testnets
    # included) plus the bulk-archive CDNs — this is NOT an open proxy.
    #
    # PAYWALL (off). MLC_PROXY_GATE=open on the app server — must-proxy stays
    # in the free catalog. To lock the WHOLE prefix (must-proxy + future
    # geo-relay) behind paid: set MLC_PROXY_GATE=entitled AND add
    # `auth_request /api/proxy/auth;` here so the URL cannot be used as an
    # open proxy. Do not flip until a paid session claim exists.
    # Policy advertisement: GET /api/proxy/entitlement (see
    # docs/mlc/plans/archive-proxy-entitlement-2026-08-28.md).
    #
    # `resolver` is mandatory: proxy_pass with a variable ($archhost) does
    # no /etc/hosts or system lookup at runtime and 502s without it.
    location ~ ^/archive-proxy/(?<archhost>data\.binance\.vision|public\.bybit\.com|static\.okx\.com|open-api\.bingx\.com|api\.binance\.com|dapi\.binance\.com|fapi\.binance\.com|testapi\.binance\.vision|testnet\.binancefuture\.com|api-pub\.bitfinex\.com|api\.bitfinex\.com|api\.bitget\.com|www\.bitmex\.com|testnet\.bitmex\.com|www\.bitstamp\.net|api\.bybit\.com|api-testnet\.bybit\.com|api\.coinbase\.com|api\.crypto\.com|uat-api\.3ona\.co|www\.deribit\.com|test\.deribit\.com|indexer\.dydx\.trade|indexer\.v4testnet\.dydx\.exchange|api\.gateio\.ws|fx-api\.gateio\.ws|api-testnet\.gateapi\.io|fx-api-testnet\.gateio\.ws|api\.gemini\.com|api\.sandbox\.gemini\.com|api\.hbdm\.com|api\.huobi\.pro|api-aws\.huobi\.pro|api\.hyperliquid\.xyz|api\.hyperliquid-testnet\.xyz|api\.kraken\.com|demo-futures\.kraken\.com|futures\.kraken\.com|api-futures\.kucoin\.com|api-sandbox-futures\.kucoin\.com|api\.kucoin\.com|openapi-sandbox\.kucoin\.com|mainnet\.zklighter\.elliot\.ai|testnet\.zklighter\.elliot\.ai|api\.mexc\.com|contract\.mexc\.com|www\.okx\.com|api\.upbit\.com|id-api\.upbit\.com|sg-api\.upbit\.com|th-api\.upbit\.com)/(?<archpath>.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 10s;
        proxy_pass https://$archhost/$archpath$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $archhost;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent "mylittlechart-wasm";
        # Drop browser Origin/Referer. BingX (measured 2026-08-28 US/NL/RU-home):
        # no Origin → 200 ACAO:*; Origin bingx.com or open-api.bingx.com → 200
        # echo; any other Origin (incl. https://mylittlechart.org) → 403 empty.
        # That is an Origin allowlist, not a geo-block. A same-origin fetch to
        # this prefix still carries our Origin; forwarding it makes the proxy
        # reproduce the 403 it exists to avoid. Empty value = omit the header.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_read_timeout 300s;
        proxy_max_temp_file_size 2048m;
        proxy_hide_header Cache-Control;
        add_header Access-Control-Allow-Origin "https://mylittlechart.org" always;
        add_header Cache-Control $archproxy_cache always;
        # Dedicated log: the ONLY window into who needs the proxy at all
        # (direct browser→venue traffic is invisible to us by design — that
        # is the point of direct). The venue host is the first path segment;
        # per-venue usage falls out of `awk '{print $7}' | cut -d/ -f3`.
        access_log /var/log/nginx/mlc-archiveproxy.log;
    }

    # ── wasm chart app at / (canonical entry) ──────────────────────────────
    # Static, precompressed (.br sidecars from the build pipeline). Paths that
    # do not exist in the app dir (all /api/*, marketing pages, mascot, etc.)
    # fall through to the axum backend via the named location.
    # Public unauthenticated writes — see ops/nginx-mlc-ratelimit.conf (deployed
    # to /etc/nginx/conf.d/) for why this is enforced here and not at Cloudflare.
    location = /api/telemetry {
        limit_req zone=mlc_public_write burst=10 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/heartbeat {
        limit_req zone=mlc_public_write burst=10 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Device-code/agent-key/link/tg-login polling loops — no credential of
    # any kind guards a guess at the code itself (entropy + short TTL are
    # the real defense; see mylittlechart-server's own hardening findings).
    # Same `limit_req` treatment as telemetry/heartbeat above, plus the
    # app's own in-process per-IP `auth_poll` bucket (60/min, burst 30 —
    # see `ratelimit.rs`) as a second, independent layer.
    location = /api/auth/poll {
        limit_req zone=mlc_auth_poll burst=30 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/auth/agent-key/poll {
        limit_req zone=mlc_auth_poll burst=30 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/auth/link/poll {
        limit_req zone=mlc_auth_poll burst=30 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /api/auth/tg-login/poll {
        limit_req zone=mlc_auth_poll burst=30 nodelay;
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Release artifacts, served from the edge's own disk. They are neither user
    # data nor control state: rebuildable, downloaded by clients, and they have
    # no business on the backed-up encrypted store that exists to protect
    # accounts. Paths carry the version, so they are immutable by construction.
    #
    # Cache-Control deliberately has no `always`: that modifier stamps error
    # responses too, and on 2026-08-30 it put max-age=31536000 on a 403 caused
    # by a 0600 file mode. Cloudflare cached the 403 for a year at one PoP and
    # it took a purge token to undo. An immutable hint belongs on success only.
    location /dl/ {
        alias /opt/mlc/static/dl/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        types { } default_type application/octet-stream;
        autoindex off;
    }

    # Live pointer stream. Stays on this edge (mlc-edge-live). The moving
    # line does not go to the control box. `$mlc_edge_name` is injected on
    # the ordinary API hop so the first Live toggle pins the token here.
    location /api/share-live/ {
        proxy_pass http://127.0.0.1:19220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Mlc-Edge $mlc_edge_name;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        error_page 418 = @mlc_share_preview;
        if ($mlc_share_preview) {
            return 418;
        }

        root /opt/mlc/static/app;
        index index.html;
        try_files $uri $uri/ @mlc_backend;

        brotli_static on;

        add_header Cache-Control $app_cache;
        add_header Vary Accept-Encoding;
        # CSP: wasm-unsafe-eval is required to instantiate the module.
        # connect-src: live exchange websockets + REST backfill go DIRECT
        # from the browser; /archive-proxy/ and /api/* on self cover the rest.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Marketing landing moved off the root: /home proxies to the backend's /
    # (which renders the landing index). Landing pages (/privacy.html, ...)
    # keep working at their old root paths via the @mlc_backend fallthrough.
    location = /home {
        proxy_pass http://mlc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /home/ {
        proxy_pass http://mlc_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Directory pages live at {dir}/index.html in the backend statics; the
    # backend's clean-URL handler only maps {path}.html, so the bare dir
    # would 404. Redirect to the trailing-slash form.
    location = /blog {
        return 301 /blog/;
    }

    # Internal redirect from `location /` for `/?share=`. The original URI,
    # including the query, is preserved (`error_page 418 = @name`). The
    # control box serves index.html with that share's og:image. The wasm
    # URLs in that file still point at this edge.
    location @mlc_share_preview {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location @mlc_backend {
        proxy_pass http://mlc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
