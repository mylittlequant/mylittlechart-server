[package]
name = "mlc-opsd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mlc-opsd"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
# Same pin as the server: rusqlite 0.40, bundled-sqlcipher. Vendored
# OpenSSL stays on the musl target only. opsd.sqlite has no key; SQLCipher
# still opens that plaintext file.
rusqlite = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
nemo-service = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
russh-sftp = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
