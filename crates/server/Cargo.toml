[package]
name = "mylittlechart-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mylittlechart-server"
path = "src/main.rs"

[[bin]]
name = "mlc-edge-live"
path = "src/bin/edge_live.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
tokio-util = { workspace = true }
subtle = { workspace = true }
dotenvy = { workspace = true }
tg-login-bot = { path = "../tg-login-bot" }
mlc-alert-daemon = { path = "../mlc-alert-daemon" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# `tower::limit::ConcurrencyLimitLayer` (main.rs's app-wide concurrency
# backstop) and `tower::service_fn` (main.rs's bare-404 `ServeDir` fallback)
# need `tower` as a real dependency, not just the test-only `ServiceExt`
# import it used to be — already resolved transitively via axum itself (see
# Cargo.lock), so this makes it directly nameable rather than adding a new
# crate to the dependency graph. `ServiceExt::oneshot` (routes/mod.rs's
# admin-gate tests) rides along on the same `util` feature.
tower = { workspace = true }
unicode-normalization = { workspace = true }
image = { workspace = true }

# Static musl builds cannot link a system OpenSSL, so the deploy target — and
# only the deploy target — builds it from source. Features are additive, so
# this rides on top of the workspace's `bundled-sqlcipher` rather than
# replacing it.
[target.'cfg(target_env = "musl")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
