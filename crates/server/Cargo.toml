[package]
name = "mylittlechart-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mylittlechart-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
tokio-util = { workspace = true }
subtle = { workspace = true }
dotenvy = { workspace = true }
tg-login-bot = { path = "../tg-login-bot" }
mlc-alert-daemon = { path = "../mlc-alert-daemon" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }

# Static musl builds cannot link a system OpenSSL, so the deploy target — and
# only the deploy target — builds it from source. Features are additive, so
# this rides on top of the workspace's `bundled-sqlcipher` rather than
# replacing it.
[target.'cfg(target_env = "musl")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

# Test-only: drives a built `Router` through a request with `ServiceExt::oneshot`
# (see routes/mod.rs's admin-gate tests). Already resolved transitively via axum
# itself (see Cargo.lock) — this only makes it directly nameable, no new crate
# enters the dependency graph.
[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
