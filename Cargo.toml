[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# SQLCipher needs a crypto provider; that provider is OpenSSL. WHICH OpenSSL
# depends on the target, so the vendored variant is NOT the default here.
#
# `bundled-sqlcipher` links the system OpenSSL. That is the right answer
# everywhere a system OpenSSL exists, including the Windows opbox, where
# `nemo/.cargo/config.toml` already points OPENSSL_DIR/LIB_DIR/INCLUDE_DIR
# at C:\Program Files\OpenSSL-Win64.
#
# The musl deploy target adds `bundled-sqlcipher-vendored-openssl` on top
# (see crates/server/Cargo.toml) — a static binary cannot link a system
# library, so there it genuinely has to build OpenSSL from source.
#
# It used to carry the vendored feature unconditionally (bee1802,
# "vendored openssl for sqlcipher (static musl target)"), which made every
# host build OpenSSL from source — a deploy-target requirement leaking into
# every local `cargo check`. On the opbox that fails outright: the only perl
# is the one shipped with Git for Windows and it has no
# Locale::Maketext::Simple, so `./Configure` aborts and the server crate
# could not be type-checked here at all.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
hex = "0.4"
hmac = "0.12"
tokio-util = { version = "0.7", features = ["io"] }
subtle = "2"
dotenvy = "0.15"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
async-trait = "0.1"
aes-gcm = "0.10"
# `nemo-service` is a sibling submodule of this one, not a crates.io crate —
# cross-submodule path deps are accepted workspace-wide (see nemo/CLAUDE.md).
# Consumed by `crates/opsd` only today (d-watchdog registration, see
# nemo/docs/d-watchdog/plans/service-registration-and-pid-ownership-2026-09-22.md
# step 4). TRAP: cargo resolves every workspace member's manifest, this path
# included, before it builds anything — even with `-p mylittlechart-server`.
# A musl build container with only this directory mounted fails at
# resolution (`failed to read /home/rust/nemo-service/Cargo.toml`, measured
# 2026-09-22). Build through `nemo/CICD/mlc/scripts/build-server-musl.sh`,
# which mounts the sibling at the matching path; a new sibling path
# dependency needs its own mount added there.
nemo-service = { path = "../nemo-service" }
tower = { version = "0.5", default-features = false, features = ["limit", "util"] }
# Pure-Rust Unicode Normalization Forms (NFC) — the one text-cleaning
# primitive `std` has no equivalent for; see `crates/server/src/text_policy.rs`.
unicode-normalization = "0.1"
# Per-link preview image decode/re-encode (docs/mlc/plans/share-policy-
# 2026-09-25.md §9) — PNG-only feature set keeps the build minimal (no
# jpeg/webp/etc pulled in). Pinned to the EXACT version already vetted in
# the mylittlechart client's own Cargo.lock (`mylittlechart/Cargo.lock`,
# `image` 0.25.10) rather than a caret range, so this crate never resolves a
# different `image` release than the one already reviewed.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
